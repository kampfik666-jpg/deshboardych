services:
  - type: web
    name: deshboardych
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONIOENCODING
        value: utf-8
      - key: TIMEZONE
        value: Asia/Yekaterinburg
      - key: MINIAPP_ENABLED
        value: true
      - key: DB_PATH
        value: data/lifehub.sqlite3
      - key: UPLOAD_DIR
        value: data/uploads
